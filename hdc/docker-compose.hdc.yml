services:
  redis:
    image: redis:7.2-alpine
    container_name: hdc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - daisugi-net

  hdc-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdc-api
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - REDIS_URL=redis://hdc-redis:6379/0
      - HUDSON_WEBHOOK_SECRET=daisugi_hudson_secret_sha256_shared_key
      - HUDSON_TOKEN_JWT=token_jwt_operador_secreto
      - DAI_CALLBACK_URL=http://dai:8001/api/webhooks/hudson-callback
    depends_on:
      - redis
    networks:
      - daisugi-net

  hdc-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdc-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://hdc-redis:6379/0
      - HUDSON_WEBHOOK_SECRET=daisugi_hudson_secret_sha256_shared_key
      - HUDSON_TOKEN_JWT=token_jwt_operador_secreto
      - DAI_CALLBACK_URL=http://dai:8001/api/webhooks/hudson-callback
    depends_on:
      - redis
    networks:
      - daisugi-net

volumes:
  redis_data:

networks:
  daisugi-net:
    external: true
